name: AuTopsy core checks

on:
  push:
    branches: [main, video-preview]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  video-core:
    name: Video core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout AuTopsy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure independent feature checks
        run: cmake -S src/video -B _core-build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build _core-build --config Release --parallel 2
      - name: Test owned video models
        run: ctest --test-dir _core-build -C Release --output-on-failure

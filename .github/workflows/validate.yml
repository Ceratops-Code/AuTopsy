name: Validate

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, labeled, edited]
  workflow_dispatch:
    inputs:
      build_installer:
        description: Build the unsigned Windows installer after the checks
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  validate-repository:
    timeout-minutes: 90
    name: AuTopsy checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check pull request source for main
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        shell: bash
        env:
          PR_HEAD_BRANCH: ${{ github.head_ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_BASE_REPO: ${{ github.repository }}
        run: |
          if [[ "$PR_HEAD_BRANCH" != release/local || "$PR_HEAD_REPO" != "$PR_BASE_REPO" ]]; then
            echo "::error::Pull requests to main must come from this repository's release/local."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"
      - name: Install npm validation dependencies
        run: npm --prefix scripts ci
      - name: Prepare locked Python tools
        run: uv sync --project scripts --locked
      - name: Check shell scripts
        # Vendored library scripts retain their upstream policy, matching SDLC.
        run: >-
          uv run --project scripts --locked python -c
          "import subprocess; paths = subprocess.check_output(['git', 'ls-files', '-z', '--', '*.sh', ':(exclude)lib-src/**']).split(b'\0'); subprocess.run(['shellcheck', '--severity=error', '--', *[path.decode('utf-8') for path in paths if path]], check=True)"
      - name: Check Markdown
        run: npm --prefix scripts run lint:markdown
      - name: Check Python style
        run: uv run --project scripts --locked python -m ruff check . --config scripts/pyproject.toml
      - name: Check Python types
        run: uv run --project scripts --locked python -m mypy --config-file scripts/pyproject.toml
      - name: Check GitHub workflows
        run: uv run --project scripts --locked python scripts/run-actionlint.py
      - name: Prepare Windows C++ tools
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
      - name: Run affected repository tests
        env:
          AUTOPSY_TEST_LEVEL: beta
          GH_TOKEN: ${{ github.token }}
        run: uv run --project scripts --locked python scripts/run_affected_tests.py

      - name: Upload validation evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: ignore
          include-hidden-files: true
          name: repository-validation-evidence-${{ matrix.os }}
          retention-days: 7
          path: |
            build/_test-results/**/_result-*.json
            build/_test-results/_command-failure.json

  build-windows-installer:
    name: Windows x64 installer (unsigned)
    if: (github.event_name == 'workflow_dispatch' && inputs.build_installer) || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'build-windows-installer'))
    needs: validate-repository
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Prepare Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build installer from this revision
        id: installer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $json = uv run --project scripts --locked python scripts/build/windows/build_video_installer.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $result = $json | ConvertFrom-Json -ErrorAction Stop
          "installer=$(Join-Path $result.artifact_directory $result.filename)" >> $env:GITHUB_OUTPUT
          $manifest = Join-Path $env:RUNNER_TEMP '_build-manifest.json'
          Set-Content -LiteralPath $manifest -Value $json -Encoding utf8
          "manifest=$manifest" >> $env:GITHUB_OUTPUT
      - name: Upload unsigned installer and source manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AuTopsy-Windows-x64-unsigned
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
          path: |
            ${{ steps.installer.outputs.installer }}
            ${{ steps.installer.outputs.manifest }}

  dependency-configuration:
    name: Dependency configuration
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js for Renovate configuration checks
        id: renovate_node
        if: >-
          hashFiles('renovate.json', 'renovate.jsonc', 'renovate.json5',
          '.github/renovate.json', '.github/renovate.jsonc', '.github/renovate.json5',
          '.renovaterc', '.renovaterc.json', '.renovaterc.jsonc', '.renovaterc.json5',
          'org-inherited-config.json') != '' ||
          (github.event.repository.name == 'renovate-config' &&
          hashFiles('**/*.json', '**/*.jsonc', '**/*.json5') != '')
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '26.13.0'

      - name: Check Renovate configuration
        if: steps.renovate_node.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          config_files=()
          repository="${GITHUB_REPOSITORY:-}"
          # Preset repositories own their tracked JSON-family files.
          if [[ "${repository##*/}" == renovate-config || -f org-inherited-config.json ]]; then
            while IFS= read -r -d '' config_file; do
              config_files+=("$config_file")
            done < <(git ls-files -z -- '*.json' '*.jsonc' '*.json5')
            wait "$!"
          else
            for config_file in renovate.json renovate.jsonc renovate.json5 \
              .github/renovate.json .github/renovate.jsonc .github/renovate.json5 \
              .renovaterc .renovaterc.json .renovaterc.jsonc .renovaterc.json5; do
              if [[ -f "$config_file" ]]; then
                config_files+=("$config_file")
              fi
            done
          fi
          if [[ "${#config_files[@]}" -eq 0 ]]; then
            echo "No repository-owned Renovate configuration files."
            exit 0
          fi
          for config_file in "${config_files[@]}"; do
            if [[ "$config_file" == *.json ]]; then
              node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8").replace(/^\uFEFF/, ""))' "$config_file"
            fi
          done
          # This offline check does not inspect Mend jobs or fetch private presets.
          npm exec --yes --package=renovate@44.240.0 -- \
            renovate-config-validator --no-global --strict "${config_files[@]}"

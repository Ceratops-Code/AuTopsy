name: Validate

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      build_installer:
        description: Build the unsigned Windows installer after the checks
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  validate-repository:
    name: AuTopsy checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"
      - name: Install npm validation dependencies
        run: npm --prefix scripts ci
      - name: Require ShellCheck
        if: runner.os != 'Windows'
        run: shellcheck --version
      - name: Prepare ShellCheck on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command shellcheck -ErrorAction SilentlyContinue)) {
            choco install shellcheck --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          shellcheck --version
      - name: Validate and test through SDLC
        uses: Ceratops-Code/Ceratops-AI-Agents-Kit/skills/ceratops-repo-lifecycle/scripts@fd2616cac03ef727a0ea96dc778ad15295d05b90
        env:
          AUTOPSY_TEST_LEVEL: beta
          GH_TOKEN: ${{ github.token }}
          CERATOPS_PROJECTS_ROOT: ${{ github.workspace }}/..
          CERATOPS_TASK_TEMP_ROOT: ${{ runner.temp }}
        with:
          repo-root: ${{ github.workspace }}
          evidence-file: ${{ runner.temp }}/repository-validation.log

      - name: Upload validation evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: ignore
          include-hidden-files: true
          name: repository-validation-evidence-${{ matrix.os }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/repository-validation.log
            .build/deploy-validation/repository-validation.log
            .build/_test-results/**/_result-*.json

  build-windows-installer:
    name: Windows x64 installer (unsigned)
    if: (github.event_name == 'workflow_dispatch' && inputs.build_installer) || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'build-windows-installer'))
    needs: validate-repository
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Prepare Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build installer from this revision
        id: installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --project scripts --locked --python 3.12 --with cmake==3.31.10 python scripts/build/windows/build_video_installer.py --build-dir .build/_windows-installer
      - name: Upload unsigned installer and source manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AuTopsy-Windows-x64-unsigned
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
          path: |
            ${{ steps.installer.outputs.installer }}
            ${{ steps.installer.outputs.manifest }}
      - name: Upload build failure details
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-installer-failure
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
          path: |
            .build/_windows-installer/_build_command_failure.json
            .build/_windows-installer/_test_command_failure.json

[project]
name = "repository-tools"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    "mypy",
    "pywin32>=312 ; sys_platform == 'win32'",
    "ruff",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = []

[tool.ruff]
target-version = "py314"
# Own the fork tooling; inherited scripting examples keep their upstream policy.
include = [
  "scripts/validate-repository.py",
  "scripts/run-actionlint.py",
  "scripts/run_affected_tests.py",
  "scripts/test_run_affected_tests.py",
  "scripts/test_native_test_results.py", "scripts/test_native_test_sessions.py",
  "scripts/piped-work/run_native_test_sessions.py", "scripts/piped-work/prepare_test_media.py",
  "scripts/piped-work/test_fork_features.py",
  "scripts/piped-work/test_video_clip_edits.py", "scripts/piped-work/test_video_transport.py",
  "scripts/piped-work/run_fork_test_harness.py",
  "scripts/piped-work/run_audacity_consumer.py",
  "scripts/piped-work/test_run_audacity_consumer.py",
  "scripts/piped-work/prepare_audacity_consumer.py",
  "scripts/piped-work/test_prepare_audacity_consumer.py",
  "scripts/build/windows/build_video_installer.py",
  "scripts/build/windows/test_build_video_installer.py",
]
force-exclude = true
# The contract renderer supplies the shared Python target and rule policy.

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S105", "S106", "S107", "S501", "S602", "S604", "S605", "ASYNC210", "ASYNC212", "ASYNC220", "ASYNC221", "ASYNC222", "ASYNC230", "ASYNC240", "ASYNC250", "ASYNC251", "DTZ003", "DTZ004", "DTZ005", "DTZ006", "UP", "RUF100"]
ignore = ["E501"]

[tool.mypy]
# The GUI test driver targets Win32 even when lint runs on a Linux host.
platform = "win32"
files = [
  "scripts/validate-repository.py",
  "scripts/run-actionlint.py",
  "scripts/run_affected_tests.py",
  "scripts/test_run_affected_tests.py",
  "scripts/test_native_test_results.py", "scripts/test_native_test_sessions.py",
  "scripts/piped-work/run_native_test_sessions.py", "scripts/piped-work/prepare_test_media.py",
  "scripts/piped-work/test_fork_features.py",
  "scripts/piped-work/test_video_clip_edits.py", "scripts/piped-work/test_video_transport.py",
  "scripts/piped-work/run_fork_test_harness.py",
  "scripts/piped-work/run_audacity_consumer.py",
  "scripts/piped-work/test_run_audacity_consumer.py",
  "scripts/piped-work/prepare_audacity_consumer.py",
  "scripts/piped-work/test_prepare_audacity_consumer.py",
  "scripts/build/windows/build_video_installer.py",
  "scripts/build/windows/test_build_video_installer.py",
]
exclude = ["(^|/)\\.venv/"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_configs = true

version: 5
kind: ceratops-sdlc
repository:
  capabilities:
    uv:
      executable: uv
    shellcheck:
      executable: shellcheck
    cmake:
      executable: cmake
    ctest:
      executable: ctest
  actions:
    bootstrap:
      requires:
        capabilities:
          - uv
      steps:
        - run:
            - uv
            - sync
            - --project
            - scripts
            - --locked
    pre-build-checks:
      check-groups:
        source:
          requires:
            capabilities:
              - uv
              - shellcheck
          steps:
            - run:
                - uv
                - run
                - --locked
                - scripts/validate-repository.py
          validation-capabilities:
            - shellcheck
        tests:
          requires:
            capabilities:
              - uv
              - cmake
              - ctest
          steps:
            - run:
                - uv
                - run
                - --project
                - scripts
                - --locked
                - python
                - scripts/run_affected_tests.py
deliverables:
  packages:
    windows-installer:
      root-dir: .
      build-after: []
      artifact:
        type: windows-installer
        output-directory: .build/_windows-installer/package
        filename-pattern: autopsy-win-*-x64.exe
      actions:
        build:
          requires:
            capabilities:
              - uv
          parameters: [build_dir, inno_compiler]
          steps:
            - run:
                - uv
                - run
                - --project
                - scripts
                - --locked
                - --python
                - "3.12"
                - --with
                - cmake==3.31.10
                - python
                - scripts/build/windows/build_video_installer.py
                - --build-dir
                - "{build_dir}"
                - --inno-compiler
                - "{inno_compiler}"
        pre-build-checks:
          check-groups:
            tests:
              requires:
                capabilities: []
              no-op: The repository tests exercise the portable installer builder. Every new installer build must pass fork-fixtures before packaging and records that result in its build manifest.
        publish:
          requires:
            capabilities: [uv]
          steps:
            - run:
                - uv
                - run
                - --project
                - scripts
                - --locked
                - --python
                - "3.12"
                - python
                - scripts/build/windows/build_video_installer.py
                - --publish-installer
  apps:
    autopsy:
      root-dir: .
      manifest: win/Inno_Setup_Wizard/audacity.iss.in
      build-after: [deliverables.packages.windows-installer]
      actions:
        pre-build-checks:
          check-groups:
            source:
              requires:
                capabilities: []
              no-op: Installer payload checks belong to the windows-installer package; there is no separate application scan.
            tests:
              requires:
                capabilities: []
              no-op: Each prerequisite installer build checks its synthetic media before packaging; repository tests cover the portable feature models and builder.
        install:
          requires:
            capabilities: []
          parameters: [installer_path]
          steps:
            - run:
                - "{installer_path}"
                - /VERYSILENT
                - /SUPPRESSMSGBOXES
                - /NORESTART

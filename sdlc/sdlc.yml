version: 4
kind: ceratops-sdlc
repository:
  capabilities:
    uv:
      executable: uv
    shellcheck:
      executable: shellcheck
    cmake:
      executable: cmake
    ctest:
      executable: ctest
  actions:
    bootstrap:
      requires:
        capabilities:
          - uv
      steps:
        - run:
            - uv
            - sync
            - --project
            - scripts
            - --locked
    validate:
      requires:
        capabilities:
          - uv
          - shellcheck
      steps:
        - run:
            - uv
            - run
            - --locked
            - scripts/validate-repository.py
      validation-capabilities:
        - shellcheck
    test:
      requires:
        capabilities:
          - uv
          - cmake
          - ctest
      steps:
        - run:
            - cmake
            - -S
            - src/video
            - -B
            - .build/_core
            - -DCMAKE_BUILD_TYPE=Release
        - run:
            - cmake
            - --build
            - .build/_core
            - --config
            - Release
            - --parallel
            - "2"
        - run:
            - ctest
            - --test-dir
            - .build/_core
            - -C
            - Release
            - --output-on-failure
deliverables:
  packages:
    windows-installer:
      source: .
      prerequisites: []
      artifact:
        type: windows-installer
        output-directory: .build/_windows-installer/package
        filename-pattern: autopsy-win-*-x64.exe
      actions:
        build:
          requires:
            capabilities:
              - uv
          steps:
            - run:
                - uv
                - run
                - --project
                - scripts
                - --locked
                - --python
                - "3.12"
                - --with
                - cmake==3.31.10
                - python
                - scripts/build/windows/build_video_installer.py
                - --build-dir
                - .build/_windows-installer
        test:
          requires:
            capabilities:
              - ctest
          parameters: [build_dir, test_name]
          steps:
            - run:
                - ctest
                - --test-dir
                - "{build_dir}"
                - -C
                - Release
                - --output-on-failure
                - -R
                - "{test_name}"
                - --no-tests=error

version: 5
kind: ceratops-sdlc
repository:
  tools:
    uv:
      executable: uv
    shellcheck:
      executable: shellcheck
    cmake:
      executable: cmake
    ctest:
      executable: ctest
    python:
      executable: python
      version-from:
        file: scripts/pyproject.toml
        key: project.requires-python
    node:
      executable: node
      version-from:
        file: scripts/package.json
        key: engines.node
    npm:
      executable: npm
  actions:
    bootstrap:
      requires:
        tools: [uv, node, npm]
      steps:
        - run: [uv, sync, --project, scripts, --locked]
        - run: [npm, ci, --prefix, scripts]
    pre-build-checks:
      check-groups:
        shellcheck:
          requires:
            tools: [shellcheck]
          validation-tools: [shellcheck]
          check-results:
            result-owner: operation
            product-inputs:
              - au4/buildscripts/ci/learn/make_playlists_info_file.sh
              - au4/buildscripts/ci/learn/push_file_to_s3.sh
              - au4/buildscripts/ci/linux/ci_all.sh
              - au4/buildscripts/ci/linux/make_appimage.sh
              - au4/buildscripts/ci/linux/setup.sh
              - au4/buildscripts/ci/macos/setup.sh
              - au4/buildscripts/ci/tools/s3_install.sh
              - au4/buildscripts/ci/windows/ci_all.sh
              - au4/buildscripts/packaging/Linux+BSD/mscore.1.preview.sh
              - au4/buildscripts/packaging/MacOS/make_dmg.sh
              - linux/AppImage/AppRun.sh
              - linux/AppImage/apprun-hooks/00-preserve-environment.sh
              - linux/AppImage/apprun-hooks/install-url-handler.sh
              - linux/AppImage/apprun-hooks/setup-gtk2-theme.sh
              - linux/audacity.sh
              - linux/check_dependencies.sh
              - linux/create_appimage.sh
              - linux/packages/arch/dependencies.sh
              - linux/packages/arch/entrypoint.sh
              - linux/packages/build_package.sh
              - linux/packages/build_packages.sh
              - linux/packages/fedora34/dependencies.sh
              - linux/packages/fedora34/entrypoint.sh
              - linux/packages/prepare_offline_dependencies.sh
              - linux/packages/ubuntu-20.04/dependencies.sh
              - linux/packages/ubuntu-20.04/entrypoint.sh
              - linux/ubuntu-focal/dependencies.sh
              - linux/ubuntu-focal/entrypoint.sh
              - locale/diagnostics.sh
              - locale/no_id.sh
              - locale/update_po_files.sh
              - modules/import-export/mod-ffmpeg/lib-ffmpeg-support/generator/generate_headers.sh
              - scripts/build/macOS/build_universal.sh
              - scripts/build/macOS/hdiutil_wrapper.sh
            check-inputs: [sdlc/sdlc.yml, .shellcheckrc, '**/.shellcheckrc']
            tools: [shellcheck]
          steps:
            - run:
                - shellcheck
                - --severity=error
                - --
                - au4/buildscripts/ci/learn/make_playlists_info_file.sh
                - au4/buildscripts/ci/learn/push_file_to_s3.sh
                - au4/buildscripts/ci/linux/ci_all.sh
                - au4/buildscripts/ci/linux/make_appimage.sh
                - au4/buildscripts/ci/linux/setup.sh
                - au4/buildscripts/ci/macos/setup.sh
                - au4/buildscripts/ci/tools/s3_install.sh
                - au4/buildscripts/ci/windows/ci_all.sh
                - au4/buildscripts/packaging/Linux+BSD/mscore.1.preview.sh
                - au4/buildscripts/packaging/MacOS/make_dmg.sh
                - linux/AppImage/AppRun.sh
                - linux/AppImage/apprun-hooks/00-preserve-environment.sh
                - linux/AppImage/apprun-hooks/install-url-handler.sh
                - linux/AppImage/apprun-hooks/setup-gtk2-theme.sh
                - linux/audacity.sh
                - linux/check_dependencies.sh
                - linux/create_appimage.sh
                - linux/packages/arch/dependencies.sh
                - linux/packages/arch/entrypoint.sh
                - linux/packages/build_package.sh
                - linux/packages/build_packages.sh
                - linux/packages/fedora34/dependencies.sh
                - linux/packages/fedora34/entrypoint.sh
                - linux/packages/prepare_offline_dependencies.sh
                - linux/packages/ubuntu-20.04/dependencies.sh
                - linux/packages/ubuntu-20.04/entrypoint.sh
                - linux/ubuntu-focal/dependencies.sh
                - linux/ubuntu-focal/entrypoint.sh
                - locale/diagnostics.sh
                - locale/no_id.sh
                - locale/update_po_files.sh
                - modules/import-export/mod-ffmpeg/lib-ffmpeg-support/generator/generate_headers.sh
                - scripts/build/macOS/build_universal.sh
                - scripts/build/macOS/hdiutil_wrapper.sh
        npm-markdown-lint:
          requires:
            tools: [node, npm]
          validation-tools: [npm-markdown-lint]
          check-results:
            result-owner: operation
            product-inputs: [README.md, AGENTS.md, BUILDING.md, CONTRIBUTING.md, CODE_OF_CONDUCT.md]
            check-inputs: [sdlc/sdlc.yml, scripts/package.json, scripts/.markdownlint.json]
            dependencies: [scripts/package-lock.json]
            tools: [node, npm]
          steps:
            - run: [npm, --prefix, scripts, run, lint:markdown]
        ruff:
          requires:
            tools: [uv, python]
          validation-tools: [ruff]
          check-results:
            result-owner: operation
            product-inputs: [scripts/**/*.py, '**/*.pyi']
            check-inputs: [sdlc/sdlc.yml, scripts/pyproject.toml, .gitignore, '**/.gitignore']
            dependencies: [scripts/uv.lock]
            environment: [UV_OFFLINE, UV_PYTHON, UV_PYTHON_PREFERENCE]
            tools: [uv, python]
          steps:
            - run: [uv, run, --project, scripts, --locked, python, -m, ruff, check, ., --config, scripts/pyproject.toml]
        mypy:
          requires:
            tools: [uv, python]
          validation-tools: [mypy]
          check-results:
            result-owner: operation
            product-inputs: [scripts/**/*.py, '**/*.pyi']
            check-inputs: [sdlc/sdlc.yml, scripts/pyproject.toml, .gitignore, '**/.gitignore']
            dependencies: [scripts/uv.lock]
            environment: [UV_OFFLINE, UV_PYTHON, UV_PYTHON_PREFERENCE, MYPYPATH]
            tools: [uv, python]
          steps:
            - run: [uv, run, --project, scripts, --locked, python, -m, mypy, --config-file, scripts/pyproject.toml]
        actionlint:
          requires:
            tools: [uv, python]
          validation-tools: [actionlint]
          check-results:
            result-owner: operation
            product-inputs: [.github/workflows/*.yml, .github/workflows/*.yaml, .github/actions/**]
            check-inputs: [sdlc/sdlc.yml, scripts/pyproject.toml, scripts/run-actionlint.py, .github/actionlint.yaml,
                  .github/actionlint.yml]
            dependencies: [scripts/uv.lock]
            environment: [UV_OFFLINE, UV_PYTHON, UV_PYTHON_PREFERENCE, GITHUB_EVENT_NAME, GITHUB_EVENT_PATH,
                  GITHUB_ACTIONS]
            tools: [uv, python]
          steps:
            - run: [uv, run, --project, scripts, --locked, python, scripts/run-actionlint.py]
        tests:
          requires:
            tools: [uv, cmake, ctest]
          steps:
            - run: [uv, run, --project, scripts, --locked, python, scripts/run_affected_tests.py]
deliverables:
  packages:
    windows-installer:
      root-dir: .
      build-after: []
      artifact:
        type: windows-installer
        output-directory: .build/_windows-installer/package
        filename-pattern: autopsy-win-*-x64.exe
      actions:
        build:
          requires:
            tools: [uv]
          parameters:
            - build_dir
            - inno_compiler
          steps:
            - run:
                - uv
                - run
                - --project
                - scripts
                - --locked
                - --python
                - '3.12'
                - --with
                - cmake==3.31.10
                - python
                - scripts/build/windows/build_video_installer.py
                - --build-dir
                - '{build_dir}'
                - --inno-compiler
                - '{inno_compiler}'
        pre-build-checks:
          check-groups:
            tests:
              requires:
                tools: []
              no-op: The repository tests exercise the portable installer builder. Every new installer build must pass
                fork-fixtures before packaging and records that result in its build manifest.
        publish:
          requires:
            tools: [uv]
          steps:
            - run:
                - uv
                - run
                - --project
                - scripts
                - --locked
                - --python
                - '3.12'
                - python
                - scripts/build/windows/build_video_installer.py
                - --publish-installer
  apps:
    autopsy:
      root-dir: .
      manifest: win/Inno_Setup_Wizard/audacity.iss.in
      build-after:
        - deliverables.packages.windows-installer
      actions:
        pre-build-checks:
          check-groups:
            source:
              requires:
                tools: []
              no-op: Installer payload checks belong to the windows-installer package; there is no separate application
                scan.
            tests:
              requires:
                tools: []
              no-op: Each prerequisite installer build checks its synthetic media before packaging; repository tests
                cover the portable feature models and builder.
        install:
          requires:
            tools: []
          parameters:
            - installer_path
          steps:
            - run: ['{installer_path}', /VERYSILENT, /SUPPRESSMSGBOXES, /NORESTART]

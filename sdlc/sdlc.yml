version: 4
kind: ceratops-sdlc
repository:
  capabilities:
    uv:
      executable: uv
    shellcheck:
      executable: shellcheck
    cmake:
      executable: cmake
    ctest:
      executable: ctest
  actions:
    bootstrap:
      requires:
        capabilities:
          - uv
      steps:
        - run:
            - uv
            - sync
            - --project
            - scripts
            - --locked
    validate:
      requires:
        capabilities:
          - uv
          - shellcheck
      steps:
        - run:
            - uv
            - run
            - --locked
            - scripts/validate-repository.py
      validation-capabilities:
        - shellcheck
    test:
      requires:
        capabilities:
          - uv
          - cmake
          - ctest
      steps:
        - run:
            - cmake
            - -S
            - src/video
            - -B
            - .build/_core
            - -DCMAKE_BUILD_TYPE=Release
        - run:
            - cmake
            - --build
            - .build/_core
            - --config
            - Release
            - --parallel
            - "2"
        - run:
            - ctest
            - --test-dir
            - .build/_core
            - -C
            - Release
            - --output-on-failure
deliverables:
  packages:
    windows-installer:
      source: .
      prerequisites: []
      artifact:
        type: windows-installer
        output-directory: .build/_windows-installer/package
        filename-pattern: autopsy-win-*-x64.exe
      actions:
        build:
          requires:
            capabilities:
              - uv
          parameters: [build_dir, inno_compiler]
          steps:
            - run:
                - uv
                - run
                - --project
                - scripts
                - --locked
                - --python
                - "3.12"
                - --with
                - cmake==3.31.10
                - python
                - scripts/build/windows/build_video_installer.py
                - --build-dir
                - "{build_dir}"
                - --inno-compiler
                - "{inno_compiler}"
        test:
          requires:
            capabilities: []
          no-op: The repository tests exercise the portable installer builder. Every new installer build must pass fork-fixtures before packaging and records that result in its build manifest.
        publish:
          requires:
            capabilities: [uv]
          steps:
            - run:
                - uv
                - run
                - --project
                - scripts
                - --locked
                - --python
                - "3.12"
                - python
                - scripts/build/windows/build_video_installer.py
                - --publish-installer
  apps:
    autopsy:
      source: .
      manifest: win/Inno_Setup_Wizard/audacity.iss.in
      prerequisites: [windows-installer]
      actions:
        validate:
          requires:
            capabilities: []
          no-op: Installer payload checks belong to the windows-installer package; there is no separate application scan.
        test:
          requires:
            capabilities: []
          no-op: Each prerequisite installer build checks its synthetic media before packaging; repository tests cover the portable feature models and builder.
        install:
          requires:
            capabilities: []
          parameters: [installer_path]
          steps:
            - run:
                - "{installer_path}"
                - /VERYSILENT
                - /SUPPRESSMSGBOXES
                - /NORESTART
